{% extends 'base.html' %}

{% block title %}Admin Login | QHotels{% endblock %}

{% block extra_css %}
<style>
    :root {
        --primary: #2c3e50;
        --accent: #3498db;
        --bg: #f8f9fa;
    }
    body {
        font-family: 'Raleway', sans-serif;
        background: var(--bg);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        overflow: hidden;
    }
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    .logo {
        width: 120px;
        margin-bottom: 30px;
    }
    h2 {
        margin-bottom: 25px;
        color: var(--primary);
        font-weight: 600;
    }
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #666;
    }
    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
        transition: border-color 0.3s;
    }
    input:focus {
        border-color: var(--accent);
        outline: none;
    }
    .btn-login {
        width: 100%;
        padding: 14px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 10px;
    }
    .btn-login:hover {
        background: var(--accent);
    }
    .error {
        color: #e74c3c;
        font-size: 14px;
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="login-card">
    <img src="/static/img/logo.png" alt="QHotels Logo" class="logo">
    <h2>Admin Access</h2>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
</div>
{% endblock %}

{% block footer %}{% endblock %}
